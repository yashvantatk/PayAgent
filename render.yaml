# Render Blueprint Specification for PayAgent (100% Free Tier)
# PayPal AI Hackathon 2026 - Free Deployment (No Credit Card Required)

services:
  # =========================================================================
  # Full-Stack Web Application (Next.js 16 + React 19 + Tailwind v4)
  # =========================================================================
  - type: web
    name: payagent-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
